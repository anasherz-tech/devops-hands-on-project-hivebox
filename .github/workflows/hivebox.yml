name: hivebox workflow
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements-dev.txt

      - name: run pylint
        run: python -m pylint hivebox.py project.py test_hivebox.py

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: "Dockerfile"
      - name: run pytest
        run: pytest
      - name: build docker image
        run: docker build -t hivebox:v0.1.0 .
      - name: test /version
        run: |
          docker run -p  127.0.0.1:80:5000/tcp -d hivebox:v0.1.0
          sleep 5
          curl --silent --show-error  http://127.0.0.1:80/version | grep 'v0.1.0'
