name: hivebox workflow
on: [push, pull_request]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: run pylint
        run: python -m pylint hivebox.py project.py test_hivebox.py

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: "Dockerfile"
      - name: run pytest
        run: pytest
      - name: build docker image
        run: docker build -t hivebox:v0.1.0 .
      - name: test /version
        run: |
          docker run -p  127.0.0.1:80:5000/tcp -d hivebox:v0.1.0
          curl --silent --show-error  http://127.0.0.1:80/version | grep 'v0.1.0'
